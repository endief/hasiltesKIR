<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hasil Seleksi KIR 2026</title>
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #0a1428;
            /* dark navy base */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
        }

        /* ===== HEADER ===== */
        .header {
            background: linear-gradient(145deg, #0b1a3a, #061026);
            border-radius: 18px 18px 0 0;
            padding: 28px 20px 20px;
            text-align: center;
            border-bottom: 3px solid #1e3a6b;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -20%;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(30, 80, 150, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -40%;
            left: -10%;
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(30, 80, 150, 0.10) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-icon {
            font-size: 32px;
            color: #4a8bc2;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 20, 60, 0.5);
            position: relative;
            z-index: 1;
        }

        .header h1 span {
            color: #6aaee6;
        }

        .header .sub-title {
            font-size: 13px;
            font-weight: 300;
            color: #8ab4d6;
            letter-spacing: 4px;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .header .badge {
            display: inline-block;
            background: rgba(74, 139, 194, 0.20);
            border: 1px solid rgba(74, 139, 194, 0.30);
            border-radius: 30px;
            padding: 4px 18px;
            font-size: 11px;
            font-weight: 600;
            color: #8ab4d6;
            letter-spacing: 1px;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        /* ===== CARD ===== */
        .card {
            background: #ffffff;
            border-radius: 0 0 18px 18px;
            padding: 30px 28px 34px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
            margin-top: 0;
            position: relative;
            z-index: 2;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: #0b1a3a;
            text-align: center;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }

        .card-title i {
            color: #1a4a7a;
            margin-right: 8px;
        }

        .card-sub {
            text-align: center;
            font-size: 14px;
            color: #6b7a8f;
            margin-bottom: 26px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 16px;
        }

        /* ===== FORM ===== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #1a2a4a;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .form-group label i {
            color: #1a4a7a;
            margin-right: 6px;
            width: 18px;
        }

        .form-group .hint {
            font-size: 12px;
            color: #8a9aaa;
            font-weight: 400;
            margin-left: 26px;
            display: block;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 15px;
            border: 2px solid #dce3ed;
            border-radius: 12px;
            background: #f8faff;
            transition: all 0.25s ease;
            color: #0b1a3a;
            font-weight: 500;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1a4a7a;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(26, 74, 122, 0.10);
        }

        .form-group input::placeholder {
            color: #b0bec5;
            font-weight: 400;
        }

        /* ===== BUTTON ===== */
        .btn-submit {
            width: 100%;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(145deg, #0b1a3a, #122a52);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(11, 26, 58, 0.35);
            margin-top: 6px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(11, 26, 58, 0.45);
            background: linear-gradient(145deg, #122a52, #0b1a3a);
        }

        .btn-submit:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(11, 26, 58, 0.30);
        }

        .btn-submit i {
            margin-right: 10px;
        }

        /* ===== PDF LINK ===== */
        .pdf-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 13px;
            color: #1a4a7a;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
            letter-spacing: 0.3px;
        }

        .pdf-link i {
            margin-right: 6px;
            color: #c0392b;
        }

        .pdf-link:hover {
            color: #0b1a3a;
            text-decoration: underline;
        }

        /* ===== RESULT BOX ===== */
        .result-box {
            margin-top: 24px;
            padding: 20px 22px;
            border-radius: 14px;
            background: #f0f6fe;
            border-left: 5px solid #1a4a7a;
            display: none;
            animation: fadeSlideIn 0.45s ease forwards;
        }

        .result-box.show {
            display: block;
        }

        .result-box.success {
            border-left-color: #27ae60;
            background: #eafaf1;
        }

        .result-box.fail {
            border-left-color: #e74c3c;
            background: #fdf0ee;
        }

        .result-box .result-title {
            font-size: 16px;
            font-weight: 700;
            color: #0b1a3a;
            margin-bottom: 4px;
        }

        .result-box .result-title i {
            margin-right: 8px;
        }

        .result-box .result-detail {
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.6;
        }

        .result-box .result-detail strong {
            color: #0b1a3a;
        }

        .result-box .result-status {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .result-status.lulus {
            background: #27ae60;
            color: #fff;
        }

        .result-status.tidak-lulus {
            background: #e74c3c;
            color: #fff;
        }

        /* ===== ANIMATION ===== */
        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #4a6a8a;
            letter-spacing: 0.5px;
            opacity: 0.7;
        }

        .footer a {
            color: #6aaee6;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 540px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 22px 16px 16px;
            }

            .header h1 {
                font-size: 22px;
            }

            .card {
                padding: 22px 18px 26px;
            }

            .card-title {
                font-size: 17px;
            }

            .form-group input {
                padding: 12px 14px;
                font-size: 14px;
            }

            .btn-submit {
                font-size: 16px;
                padding: 14px 16px;
            }

            .result-box {
                padding: 16px 18px;
            }
        }

        @media (max-width: 380px) {
            .header h1 {
                font-size: 18px;
            }

            .card-title {
                font-size: 15px;
            }

            .form-group label {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== HEADER ===== -->
        <div class="header">
            <div class="header-icon">
                <i class="fas fa-flask"></i>
            </div>
            <h1>PENGGUMAHAN <span>KIR</span></h1>
            <div class="sub-title">KARYA ILMIAH REMAJA</div>
            <div class="badge"><i class="fas fa-calendar-alt"></i> 2026</div>
        </div>

        <!-- ===== CARD ===== -->
        <div class="card">

            <div class="card-title">
                <i class="fas fa-search"></i> HASIL SELEKSI KIR 2026
            </div>
            <div class="card-sub">
                Masukkan Nama dan Tanggal Lahir peserta.
            </div>

            <!-- ===== FORM ===== -->
            <form id="kirForm" autocomplete="off">

                <!-- Nama -->
                <div class="form-group">
                    <label for="nama">
                        <i class="fas fa-user"></i> Nama
                    </label>
                    <input
                    type="text"
                    id="nama"
                    placeholder="Nama lengkap peserta"
                    required
                    />
                    <span class="hint">Nama sesuai dengan pendaftaran</span>
                </div>

                <!-- Tanggal Lahir -->
                <div class="form-group">
                    <label for="tglLahir">
                        <i class="fas fa-calendar-day"></i> Tanggal Lahir
                    </label>
                    <input
                    type="text"
                    id="tglLahir"
                    placeholder="DD / MM / YYYY"
                    required
                    />
                    <span class="hint">Tanggal / Bulan / Tahun</span>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn-submit">
                    <i class="fas fa-arrow-right"></i> LIHAT HASIL SELEKSI
                </button>

            </form>

            <!-- PDF Link -->
            <a href="#" class="pdf-link" id="pdfLink">
                <i class="fas fa-file-pdf"></i> PENGUMUMAN HASIL SELEKSI KIR 2026 (PDF)
            </a>

            <!-- ===== RESULT ===== -->
            <div class="result-box" id="resultBox">
                <div class="result-title" id="resultTitle">
                    <i class="fas fa-bullhorn"></i> <span id="resultHeading">Hasil Seleksi</span>
                </div>
                <div class="result-detail" id="resultDetail">
                    <!-- Dynamic content -->
                </div>
            </div>

        </div>

        <!-- ===== FOOTER ===== -->
        <div class="footer">
            &copy; 2026 <a href="#">KIR</a> &mdash; Seleksi Karya Ilmiah Remaja
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- ===== JAVASCRIPT ===== -->
    <script>
        (function() {

            // -------- MOCK DATA (peserta KIR 2026) --------
            const pesertaData = [{
                nama: 'Aisha Putri Ramadhani',
                tglLahir: '15/03/2008',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Alam',
                judul: 'Pengaruh Ekstrak Daun Kelor terhadap Pertumbuhan Tanaman'
            }, {
                nama: 'Budi Santoso',
                tglLahir: '22/07/2007',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Sosial',
                judul: 'Analisis Pola Konsumsi Masyarakat di Era Digital'
            }, {
                nama: 'Citra Dewi Lestari',
                tglLahir: '10/11/2008',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Alam',
                judul: 'Rancang Bangun Alat Penjernih Air Sederhana'
            }, {
                nama: 'Dwiki Al Ghifari',
                tglLahir: '05/02/2007',
                status: 'Tidak Lulus',
                jurusan: '-',
                judul: '-'
            }, {
                nama: 'Eka Nur Fitriani',
                tglLahir: '19/09/2008',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Sosial',
                judul: 'Pengaruh Media Sosial terhadap Minat Baca Remaja'
            }, {
                nama: 'Farhan Ramadhan',
                tglLahir: '30/12/2007',
                status: 'Tidak Lulus',
                jurusan: '-',
                judul: '-'
            }, {
                nama: 'Gita Puspita Sari',
                tglLahir: '08/06/2008',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Alam',
                judul: 'Identifikasi Senyawa Aktif pada Kunyit sebagai Antibakteri'
            }, {
                nama: 'Hafiz Al-Fath',
                tglLahir: '14/04/2007',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Sosial',
                judul: 'Strategi Pemberdayaan UMKM di Wilayah Perkotaan'
            }, {
                nama: 'Indah Permata Hati',
                tglLahir: '27/01/2008',
                status: 'Tidak Lulus',
                jurusan: '-',
                judul: '-'
            }, {
                nama: 'Jaka Surya Atmaja',
                tglLahir: '03/08/2007',
                status: 'Lulus',
                jurusan: 'Ilmu Pengetahuan Alam',
                judul: 'Efektivitas Kompos dari Sampah Organik terhadap Kesuburan Tanah'
            }];

            // -------- DOM refs --------
            const form = document.getElementById('kirForm');
            const namaInput = document.getElementById('nama');
            const tglInput = document.getElementById('tglLahir');
            const resultBox = document.getElementById('resultBox');
            const resultHeading = document.getElementById('resultHeading');
            const resultDetail = document.getElementById('resultDetail');
            const pdfLink = document.getElementById('pdfLink');

            // -------- helpers --------
            function normalizeDate(str) {
                // cleanup: remove extra spaces, replace various separators with '/'
                let cleaned = str.trim()
                    .replace(/[.\-_,;:]/g, '/')
                    .replace(/\s+/g, ' ')
                    .replace(/\/\s+/g, '/')
                    .replace(/\s+\//g, '/');
                // if user typed "DD/MM/YYYY" or "DD-MM-YYYY" etc.
                // we want to support both DD/MM/YYYY and DD/MM/YY? 
                // We'll just compare after cleaning.
                return cleaned;
            }

            function normalizeName(str) {
                return str.trim()
                    .replace(/\s+/g, ' ')
                    .toLowerCase();
            }

            // -------- format result --------
            function renderResult(data, found) {
                resultBox.className = 'result-box show';

                if (found) {
                    const isLulus = data.status === 'Lulus';
                    resultBox.className = `result-box show ${isLulus ? 'success' : 'fail'}`;
                    resultHeading.textContent = isLulus ? '✅ SELAMAT! Anda Lulus Seleksi' : '❌ Mohon Maaf, Anda Belum Lulus';

                    let statusBadge = isLulus ?
                        `<span class="result-status lulus">LULUS</span>` :
                        `<span class="result-status tidak-lulus">TIDAK LULUS</span>`;

                    let detailHtml = `
                        <p><strong>Nama:</strong> ${data.nama}</p>
                        <p><strong>Tanggal Lahir:</strong> ${data.tglLahir}</p>
                        <p><strong>Status:</strong> ${statusBadge}</p>
                    `;

                    if (isLulus) {
                        detailHtml += `
                            <p><strong>Jurusan:</strong> ${data.jurusan}</p>
                            <p><strong>Judul Karya:</strong> ${data.judul}</p>
                        `;
                    } else {
                        detailHtml += `
                            <p style="color:#7f8c8d; font-style:italic; margin-top:6px;">
                                Tetap semangat dan terus berkarya!
                            </p>
                        `;
                    }

                    resultDetail.innerHTML = detailHtml;

                } else {
                    // Tidak ditemukan
                    resultBox.className = 'result-box show fail';
                    resultHeading.textContent = '⚠️ Data Tidak Ditemukan';
                    resultDetail.innerHTML = `
                        <p style="color:#e74c3c;">
                            <i class="fas fa-exclamation-circle"></i> 
                            Peserta dengan nama dan tanggal lahir yang Anda masukkan 
                            <strong>tidak terdaftar</strong> dalam basis data seleksi KIR 2026.
                        </p>
                        <p style="color:#7f8c8d; font-size:13px; margin-top:8px;">
                            Pastikan nama dan tanggal lahir sesuai dengan pendaftaran.
                        </p>
                    `;
                }
            }

            // -------- main search --------
            function cariPeserta(nama, tgl) {
                const namaNorm = normalizeName(nama);
                const tglNorm = normalizeDate(tgl);

                // Cari di data
                for (let p of pesertaData) {
                    const pNamaNorm = normalizeName(p.nama);
                    const pTglNorm = normalizeDate(p.tglLahir);
                    if (pNamaNorm === namaNorm && pTglNorm === tglNorm) {
                        return p;
                    }
                }
                return null;
            }

            // -------- handle submit --------
            function handleSubmit(e) {
                e.preventDefault();

                const nama = namaInput.value.trim();
                const tgl = tglInput.value.trim();

                // Validasi sederhana
                if (!nama) {
                    alert('Silakan masukkan Nama peserta.');
                    namaInput.focus();
                    return;
                }
                if (!tgl) {
                    alert('Silakan masukkan Tanggal Lahir peserta.');
                    tglInput.focus();
                    return;
                }

                // Cari
                const result = cariPeserta(nama, tgl);

                if (result) {
                    renderResult(result, true);
                } else {
                    // data not found — tampilkan pesan
                    renderResult(null, false);
                }
            }

            // -------- event listener --------
            form.addEventListener('submit', handleSubmit);

            // -------- PDF link (mock) --------
            pdfLink.addEventListener('click', function(e) {
                e.preventDefault();
                alert('📄 Pengumuman Hasil Seleksi KIR 2026 (PDF) — (simulasi unduhan)');
            });

            // -------- auto-focus --------
            namaInput.focus();

        })();
    </script>

</body>
</html>
